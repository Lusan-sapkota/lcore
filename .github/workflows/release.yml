name: Release

# Push a tag like v0.0.7 to test, build, publish to PyPI (trusted publishing) and create the GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        python: ['3.8', '3.11', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install pytest
      - run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tag must match the code version and have a changelog entry
        run: |
          python - <<'PY'
          import os, re, tomllib
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          code = re.search(r"__version__ = '([^']+)'", open('lcore.py', encoding='utf-8').read()).group(1)
          meta = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          log = open('CHANGELOG.md', encoding='utf-8').read()
          assert tag == code == meta, f'tag {tag}, lcore.py {code}, pyproject.toml {meta} must all match'
          assert re.search(r'^## \[' + re.escape(tag) + r'\]', log, re.M), f'CHANGELOG.md has no entry for {tag}'
          PY
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: [test, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # trusted publishing: no API token needed
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Release notes from CHANGELOG.md
        run: |
          python3 - <<'PY' > release-notes.md
          import os, re
          tag = os.environ['GITHUB_REF_NAME'].removeprefix('v')
          log = open('CHANGELOG.md', encoding='utf-8').read()
          m = re.search(r'^## \[' + re.escape(tag) + r'\][^\n]*\n(.*?)(?=^---$|^## \[|\Z)', log, re.S | re.M)
          print(m.group(1).strip())
          PY
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Lcore ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
